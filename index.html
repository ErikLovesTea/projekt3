<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Antiyoy Game Player</title>
    <style>
        body {
            background: #1a1a24;
            color: #e0e0e6;
            font-family: sans-serif;
            padding: 15px;
        }
        #main-layout {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .box {
            background: #252538;
            padding: 12px;
            border-radius: 6px;
            flex: 1;
        }
        .my-btn {
            background: #4a4ae2;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 4px;
        }
        .my-btn:hover {
            background: #6161f3;
        }
        .btn-red {
            background: #d93838;
        }
        .btn-red:hover {
            background: #f35151;
        }
        input, select {
            padding: 6px;
            background: #12121a;
            color: #fff;
            border: 1px solid #444;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 8px;
        }
        #map-scroll {
            background: #0f0f14;
            width: 800px;
            height: 500px;
            overflow: auto;
            border: 2px solid #333;
        }
        #map-area {
            position: relative;
            width: 2000px;
            height: 2000px;
        }
        .tile {
            position: absolute;
            cursor: pointer;
        }
        .tile:hover {
            filter: brightness(1.2);
        }
        .tile.active {
            filter: brightness(1.4) contrast(1.2);
            outline: 2px solid #fff;
        }
        .img-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
        }
        .p-row {
            padding: 3px;
            margin: 2px 0;
            background: #12121a;
        }
    </style>
</head>
<body>

    <h1>Antiyoy Multiplayer</h1>

    <div id="main-layout">
        <div class="box">
            <h3>Actions</h3>
            <p id="info-text">Click a tile on the map...</p>
            
            <div id="shop-part" style="display:none;">
                <label>Buy something:</label>
                <select id="item-type">
                    <option value="peasant">Peasant ($10)</option>
                    <option value="spearman">Spearman ($20)</option>
                    <option value="baron">Baron ($30)</option>
                    <option value="farm">Farm ($12+)</option>
                    <option value="tower">Tower ($15)</option>
                    <option value="fortress">Fortress ($35)</option>
                </select>
                <button class="my-btn" id="btn-do-buy">Buy and Place</button>
            </div>

            <div id="play-part" style="display:none;">
                <button class="my-btn" id="btn-stop-turn">End My Turn</button>
                <button class="my-btn btn-red" id="btn-leave">Surrender</button>
            </div>
        </div>

        <div class="box">
            <h3>Lobby</h3>
            <div>
                <input type="text" id="user-name" placeholder="Username">
                <button class="my-btn" id="btn-enter">Join Game</button>
                <button class="my-btn" id="btn-go">Start Game</button>
            </div>
            <div id="key-text" style="margin-top: 8px; font-size: 12px; color: #888;"></div>
            <button class="my-btn btn-red" id="btn-reset-key" style="font-size: 11px;">Clear Saved Key</button>
        </div>

        <div class="box">
            <h3>Status</h3>
            <p>State: <strong id="lbl-phase">-</strong></p>
            <p>Turn: <strong id="lbl-turn">-</strong> (<span id="lbl-player">None</span>)</p>
            <div id="group-list"></div>
        </div>
    </div>

    <div id="map-scroll">
        <div id="map-area"></div>
    </div>

    <script>
        const API_URL = "https://tinkr.tech/sdb/projekt3/mang";
        const SERVER_URL = "https://tinkr.tech";

        let serverData = null;
        let chosenTile = null; 
        let nameString = localStorage.getItem('ay_name') || "";
        let secretKey = localStorage.getItem('ay_key') || "";

        if(nameString) document.getElementById('user-name').value = nameString;
        showKeyInfo();

        setInterval(loadData, 1500);
        loadData();

        async function loadData() {
            try {
                let res = await fetch(API_URL);
                serverData = await res.json();
                drawUi();
                drawMapGrid();
            } catch (e) {}
        }

        async function postAction(obj) {
            try {
                let res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(obj)
                });
                let data = await res.json();
                if (!res.ok || data.ok === false) {
                    alert("Error: " + (data.error || "Failed"));
                    return null;
                }
                return data;
            } catch (e) {
                return null;
            }
        }

        function showKeyInfo() {
            const txt = document.getElementById('key-text');
            if(secretKey) {
                txt.innerHTML = "Logged in: " + nameString;
            } else {
                txt.textContent = "No saved key. Please join.";
            }
        }

        document.getElementById('btn-enter').addEventListener('click', async () => {
            let n = document.getElementById('user-name').value.trim();
            if(!n) return;
            let res = await postAction({ action: "join", username: n });
            if(res && res.player_key) {
                secretKey = res.player_key;
                nameString = n;
                localStorage.setItem('ay_key', secretKey);
                localStorage.setItem('ay_name', nameString);
                showKeyInfo();
                loadData();
            }
        });

        document.getElementById('btn-go').addEventListener('click', async () => {
            await postAction({ action: "start" });
            loadData();
        });

        document.getElementById('btn-stop-turn').addEventListener('click', async () => {
            if(!secretKey) return;
            await postAction({ action: "end_turn", player_key: secretKey });
            loadData();
        });

        document.getElementById('btn-leave').addEventListener('click', async () => {
            if(!secretKey) return;
            await postAction({ action: "surrender", player_key: secretKey });
            secretKey = "";
            nameString = "";
            localStorage.clear();
            showKeyInfo();
            loadData();
        });

        document.getElementById('btn-do-buy').addEventListener('click', async () => {
            if(!chosenTile || !secretKey) return alert("Select a tile first or login");
            let t = document.getElementById('item-type').value;
            await postAction({
                action: "buy",
                player_key: secretKey,
                type: t,
                hex: { col: chosenTile.col, row: chosenTile.row }
            });
            loadData();
        });

        document.getElementById('btn-reset-key').addEventListener('click', () => {
            localStorage.clear();
            secretKey = "";
            nameString = "";
            showKeyInfo();
        });

        function drawUi() {
            if(!serverData) return;

            document.getElementById('lbl-phase').textContent = serverData.phase;
            document.getElementById('lbl-turn').textContent = serverData.turn || '0';
            
            let activeUser = serverData.current_player || 'None';
            document.getElementById('lbl-player').textContent = activeUser;

            let isMyTurn = (nameString && activeUser === nameString && serverData.phase === 'playing');
            document.getElementById('play-part').style.display = (serverData.phase === 'playing' && secretKey) ? 'block' : 'none';
            document.getElementById('shop-part').style.display = isMyTurn ? 'block' : 'none';

            let list = document.getElementById('group-list');
            list.innerHTML = "";
            if(serverData.players) {
                serverData.players.forEach(p => {
                    let d = document.createElement('div');
                    d.className = "p-row";
                    if(p.username === activeUser) d.style.background = "#444466";
                    d.innerHTML = "<b>" + p.username + "</b>: $" + p.money + " (+" + (p.income - (p.upkeep || 0)) + ")";
                    list.appendChild(d);
                });
            }
        }

        function drawMapGrid() {
            const box = document.getElementById('map-area');
            if (!serverData || !serverData.map) return;
            box.innerHTML = "";

            serverData.map.forEach(h => {
                if (h.type === "impassable") return;

                let div = document.createElement('div');
                div.className = "tile";
                div.style.left = h.x + "px";
                div.style.top = h.y + "px";
                div.style.width = h.width + "px";
                div.style.height = h.height + "px";

                if(chosenTile && chosenTile.col === h.col && chosenTile.row === h.row) {
                    div.classList.add('active');
                }

                let img = document.createElement('img');
                img.src = h.image.startsWith('http') ? h.image : SERVER_URL + h.image;
                img.style.width = "100%";
                img.style.height = "100%";
                div.appendChild(img);

                if (h.unit_image) {
                    let uImg = document.createElement('img');
                    uImg.className = "img-layer";
                    uImg.src = h.unit_image.startsWith('http') ? h.unit_image : SERVER_URL + h.unit_image;
                    div.appendChild(uImg);
                }

                if (h.building_image) {
                    let bImg = document.createElement('img');
                    bImg.className = "img-layer";
                    bImg.src = h.building_image.startsWith('http') ? h.building_image : SERVER_URL + h.building_image;
                    div.appendChild(bImg);
                }

                div.addEventListener('click', () => {
                    let turnNow = (nameString && serverData && serverData.current_player === nameString && serverData.phase === 'playing');
                    
                    if (turnNow && chosenTile && (chosenTile.col !== h.col || chosenTile.row !== h.row)) {
                        let old = serverData.map.find(item => item.col === chosenTile.col && item.row === chosenTile.row);
                        if(old && old.unit) {
                            postAction({
                                action: "move",
                                player_key: secretKey,
                                from: { col: chosenTile.col, row: chosenTile.row },
                                to: { col: h.col, row: h.row }
                            }).then(res => {
                                if(res) {
                                    chosenTile = null;
                                    loadData();
                                }
                            });
                            return;
                        }
                    }

                    chosenTile = { col: h.col, row: h.row };
                    document.getElementById('info-text').innerHTML = 
                        "Col: " + h.col + ", Row: " + h.row + "<br>" +
                        "Owner: " + (h.owner || 'None') + "<br>" +
                        "Unit: " + (h.unit || 'None') + " | Build: " + (h.building || 'None');
                    
                    drawMapGrid();
                });

                box.appendChild(div);
            });
        }
    </script>
</body>
</html>
